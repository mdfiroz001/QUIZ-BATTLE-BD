<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Battle Admin</title><link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="admin"><header><b>QUIZ BATTLE <em>ADMIN</em></b><a href="/">Open App</a></header><section id="login" class="panel"><h1>Admin Login</h1><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign In</button><p id="err"></p></section><div id="dash" hidden><aside><button data-tab="overview">Overview</button><button data-tab="questions">Questions</button><button data-tab="categories">Categories</button><button data-tab="levels">Levels</button><button data-tab="users">Users</button><button data-tab="bot">Bot & Settings</button><button id="logout">Logout</button></aside><main><section id="overview"><h1>Dashboard</h1><div id="stats" class="stats"></div></section><section id="questions" hidden><h1>Create Question</h1><form id="qform" class="panel"><textarea id="question" placeholder="Question text" required></textarea><select id="category"></select><select id="lang"><option value="both">Bangla + English</option><option value="bn">Bangla</option><option value="en">English</option></select><select id="difficulty"><option>easy</option><option>medium</option><option>hard</option></select><input id="a" placeholder="Option A" required><input id="b" placeholder="Option B" required><input id="c" placeholder="Option C" required><input id="d" placeholder="Option D" required><select id="correct"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><input id="image" placeholder="Image URL (optional)"><input id="explanation" placeholder="Explanation"><button>Save Question</button></form><div id="qlist" class="panel"></div></section><section id="categories" hidden><h1>Categories</h1><form id="cform" class="panel"><input id="cname" placeholder="English name" required><input id="cbn" placeholder="বাংলা নাম"><input id="cicon" placeholder="Icon"><button>Add Category</button></form><div id="clist" class="panel"></div></section><section id="levels" hidden><h1>Level Settings</h1><form id="lform" class="panel"><input id="lno" type="number" placeholder="Level number" required><input id="lxp" type="number" placeholder="XP required" required><input id="lcount" type="number" value="10" placeholder="Question count"><input id="ltime" type="number" value="20" placeholder="Time per question"><select id="ldiff"><option>easy</option><option>medium</option><option>hard</option></select><button>Save Level</button></form><div id="llist" class="panel"></div></section><section id="users" hidden><h1>Users</h1><div id="ulist" class="panel"></div></section><section id="bot" hidden><h1>Bot & Settings</h1><div class="panel"><p>Bot token is configured as a Supabase Edge Function secret, never in this browser.</p><textarea id="broadcast" placeholder="Broadcast message"></textarea><input id="photo" placeholder="Image URL (optional)"><input id="btntext" placeholder="Inline button text"><input id="btnurl" placeholder="Inline button URL"><button id="send">Send to all users</button></div></section></main></div></div><script src="/js/config.js"></script><script src="/js/admin.js"></script></body></html>
